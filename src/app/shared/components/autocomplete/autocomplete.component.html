<mat-form-field appearance="outline">
  <input
    matInput
    [formControl]="control"
    [placeholder]="placeholder"
    [matAutocomplete]="auto"
  />
  <mat-autocomplete #auto="matAutocomplete">
    <mat-option *ngFor="let option of filteredData | async" [value]="option" (onSelectionChange)="onSelect(option)">
      {{ option }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>

<div *ngIf="errorMessage" class="error-message">
  <p>{{ errorMessage }}</p>
</div>
